                    - generic [ref=f11e118]:
                      - paragraph [ref=f11e119]: "Compact, downy mildew-resistant basil with a fresh look.Beautiful dark green, glossy leaves are medium size (2–2 1/2″ long), flat, and pointed. High-yielding for field, greenhouse, and container production. Nice Italian aroma and flavor with slightly earthy, spicy notes. Intermediate resistance to Fusarium. Bred by Dr. James Simon and Dr. Robert Pyne at Rutgers University. U.S. Utility patent 10,159,212. Ht. 16–18″. Avg. 20,700 seeds/oz. Packet: 200 seeds.DAYS TO GERMINATION:5-10 days at 65-70°F (18-21°C)."
                      - paragraph [ref=f11e120]: "SOWING:Direct seed (recommended): Plant seeds 1/4″ deep, 2-3 seeds per inch, in rows 18″ apart. Firm the soil over the seeds. Thinning is not necessary, but a final spacing of 4-8″ apart produces healthy, full plants. Note: Holy Basil requires some light for germination, so sow more shallowly than other basils. Transplant: Sow indoors 6 weeks prior to setting out. Plant 1/4″ deep and keep at 70°F (21°C) for best germination. Transplant to the field when seedlings have 3-4 sets of leaves, spacing at 4-8″ apart in rows 18″ apart."
                      - paragraph [ref=f11e121]: LIGHT PREFERENCE:Sun.
                      - paragraph [ref=f11e122]: SOIL REQUIREMENTS:Moderately rich, moist soil. Basil is not drought tolerant and can be damaged by heat stress. Regular moisture throughout the growing season helps to ensure a good crop.
                      - paragraph [ref=f11e123]: PLANT HEIGHT:Varies. See the product description for exact heights.
                      - paragraph [ref=f11e124]: PLANT SPACING:4-8″.
                      - paragraph [ref=f11e125]: HARDINESS ZONES:Annual.
                      - paragraph [ref=f11e126]: HARVEST:Begin light harvesting after plants have become established. It is best done in the early morning when the temperature is cooler and the leaves are less likely to wilt. A full harvest should be completed just before the plants start to flower. Cut the entire plant 4-6″ above the ground to promote a second growth. Leaves are easily bruised when picking, so handle carefully. Do not store at a temperature less than 50°F (10°C).
                      - paragraph [ref=f11e127]: PELLETED SEED:If using pelleted seed, we recommend consistent soil moisture during the germination period. seed must be kept cool and dry prior to planting, and should be used within one year of purchase.
                      - paragraph [ref=f11e128]: SCIENTIFIC NAME:Ocimum spp.
