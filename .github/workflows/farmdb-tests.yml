name: farmdb tests

# Runs the farm database tests on current and newer Python/SQLite versions, so an
# upgrade that would break bin/farm shows up here before it shows up on the farm.
on:
  push:
    paths: ["tools/**", "bin/**", ".githooks/**", ".claude/hooks/**", ".claude/settings.json",
            ".github/workflows/farmdb-tests.yml"]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly, to catch new runner/Python images
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Versions
        run: python -c "import sys, sqlite3; print(sys.version, 'SQLite', sqlite3.sqlite_version)"
      - name: Tests
        working-directory: tools/tests
        run: python -m unittest discover -p 'test_*.py' -v
